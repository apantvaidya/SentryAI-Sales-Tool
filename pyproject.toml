[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sentry-scraper-module"
version = "0.0.1"
description = "Deep-Context AI Profiling Scraper API (SentryScraperModule)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aran" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # Phase 1 — pipeline core
    "litellm>=1.51.0",
    "trafilatura>=1.12.0",
    "langchain-text-splitters>=0.3.0",
    "numpy>=2.0.0",
    # Phase 2 — orchestration, persistence, async fetch
    "langgraph>=0.2.50",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "httpx[http2]>=0.27.0",
    "arq>=0.26.0",
    # Phase 5 — migrations, cache, rate limit, metrics
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]
# Heavy deps only needed for production / when using real semantic embeddings.
# Tests rely on the in-tree HashEmbeddings fake and do not require this extra.
ml = [
    "sentence-transformers>=3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_scraper_module"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Auto-generated Alembic revisions follow the project's `script.py.mako`
# template; they don't go through our normal style passes.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI's documented `Depends(...)` pattern requires the call to live in
# the parameter default. Disable B008 only for route modules.
"src/sentry_scraper_module/api/routes/*" = ["B008"]
"src/sentry_scraper_module/api/auth.py" = ["B008"]
# arq's `WorkerSettings` is conventionally declared with class attributes
# (functions list, hooks). The mutable list default is intentional.
"src/sentry_scraper_module/worker/arq_worker.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# `sentence_transformers` is only present when the `[ml]` extra is installed.
# Tests use the in-tree HashEmbeddings fake, so silence the missing-stub
# error for the optional adapter.
[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

# LangGraph's `StateGraph` has 4 generic type parameters and a heavily
# overloaded `add_node`. Mypy can't infer the generics through a single
# positional argument, so it widens `StateT` to `Never` and every `add_node`
# call looks like a type mismatch. Runtime is fine; suppress the noise
# locally on the graph module.
[[tool.mypy.overrides]]
module = "sentry_scraper_module.agents.graph"
disable_error_code = ["arg-type", "call-overload"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["sentry_scraper_module"]

[tool.coverage.report]
show_missing = true
skip_covered = true
