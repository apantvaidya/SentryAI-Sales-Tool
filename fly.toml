# Fly.io configuration for SentryScraperModule. Phase 5.
#
# Deploy plan
# -----------
# 1. Provision once (run from repo root):
#      fly launch --no-deploy --copy-config         # creates the app
#      fly postgres create --name sentry-db         # managed Postgres
#      fly redis create --name sentry-redis         # Upstash via Fly
#      fly postgres attach sentry-db                # sets DATABASE_URL
#      fly redis status sentry-redis                # set REDIS_URL secret
#      fly secrets set BOOTSTRAP_API_KEYS=acme:prod-bootstrap \
#                      OPENAI_API_KEY=... \
#                      SERPER_API_KEY=...
# 2. Deploy:
#      fly deploy
# 3. Schema migrations run automatically via the `release_command`
#    below; `auto_create_tables` is False in prod, so this is the
#    single source of truth for schema.
#
# Process groups: `api` runs uvicorn (HTTP) and `worker` runs arq. Each
# has its own machine count so we can scale them independently.

app = "sentry-scraper-module"
primary_region = "sjc"  # same region as the managed Postgres + Redis
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Run migrations as part of every deploy. Fly executes this against a
# one-off machine before swapping traffic, so a failed migration aborts
# the deploy without taking the prod cluster down.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  APP_ENV = "prod"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "json"
  AUTO_CREATE_TABLES = "false"
  METRICS_ENABLED = "true"
  RATE_LIMIT_PER_MINUTE = "60"
  RATE_LIMIT_BURST = "120"
  PORT = "8000"

# ---------------------------------------------------------------------------
# Process groups
# ---------------------------------------------------------------------------
[processes]
  api = "uvicorn sentry_scraper_module.api.main:app --host 0.0.0.0 --port 8000"
  worker = "arq sentry_scraper_module.worker.arq_worker.WorkerSettings"

# ---------------------------------------------------------------------------
# HTTP service for `api` only.
# ---------------------------------------------------------------------------
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # always-on so cold-start latency stays low
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# ---------------------------------------------------------------------------
# Machine sizing. Worker gets a beefier VM because the LangGraph pipeline
# is CPU-bound during distillation/extraction.
# ---------------------------------------------------------------------------
[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# Prometheus scraping. Fly's metrics aggregator pulls /metrics from the
# `api` group only; the worker emits via `arq`'s built-in stats.
[metrics]
  port = 8000
  path = "/metrics"
  processes = ["api"]
